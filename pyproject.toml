[project]
name = "farc"
version = "0.1.0"
description = "Failure-Aware Hierarchical Control: selective residual reinforcement learning for robust robotic manipulation"
readme = "README.md"
license = "MIT"
authors = [{ name = "m-alan08" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "mujoco>=3.1,<3.12",
    "gymnasium>=1.0",
    "gymnasium-robotics>=1.3",
    "matplotlib>=3.8",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]
cpu = ["torch==2.14.1"]
cu126 = ["torch==2.14.1"]
cu130 = ["torch==2.14.1"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests"]
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["gymnasium_robotics.*", "mujoco.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [
    [{ group = "cpu" }, { group = "cu126" }, { group = "cu130" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", group = "cu126", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu130", group = "cu130", marker = "sys_platform == 'linux'" },
]
